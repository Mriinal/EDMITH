<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=leaderboard/index.html">
    <link rel="canonical" href="https://edmith.com/leaderboard/index.html">
    <title>Redirecting to Official Leaderboards | EDMITH</title>
    <script>
        window.location.replace("leaderboard/index.html" + window.location.hash);
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            padding: 2rem;
            max-width: 420px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(121, 63, 224, 0.2);
            border-top-color: #793FE0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #793FE0;
            text-decoration: underline;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>Opening Official Leaderboard...</h2>
        <p>If you are not redirected automatically, <a href="leaderboard/index.html">click here to proceed to the Hall of Champions</a>.</p>
    </div>
</body>

</html>
