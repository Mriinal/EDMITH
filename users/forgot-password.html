<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Reset your EDMITH account password.">
    <title>Forgot Password - EDMITH</title>

    <!-- Prevent theme flicker before paint -->
    <script>
        (function () {
            const theme = localStorage.getItem('edmith-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (!theme && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
                document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
            }
        })();
    </script>

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- ============================================================
         FIXED HEADER
    ============================================================ -->
    <header class="header" id="authHeader">
        <nav class="navbar">
            <a href="../index.html" class="logo">EDMITH</a>
            <ul class="nav-links">
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../course.html">Courses</a></li>
                <li><a href="../sql/index.html">SQL Mastery</a></li>
                <li><a href="../Leaderboard.html">Leaderboard</a></li>
            </ul>
            <div class="header-actions">
                <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="mobile-menu-btn" title="Toggle Navigation Menu" aria-label="Toggle Navigation Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- ============================================================
         MAIN AUTH AREA
    ============================================================ -->
    <main class="auth-main">
        <div class="auth-container" style="max-width: 480px;">

            <!-- Floating icons -->
            <i class="fab fa-python auth-float-icon auth-icon-1" aria-hidden="true"></i>
            <i class="fas fa-database auth-float-icon auth-icon-2" aria-hidden="true"></i>
            <i class="fas fa-code auth-float-icon auth-icon-3" aria-hidden="true"></i>
            <i class="fas fa-terminal auth-float-icon auth-icon-4" aria-hidden="true"></i>

            <!-- Forgot Password Card -->
            <div class="auth-card" id="authCard">

                <div class="auth-card-header">
                    <a href="../index.html" class="auth-card-logo">EDMITH</a>
                    <h1 class="auth-card-title">Forgot your password?</h1>
                    <p class="auth-card-subtitle">
                        Enter your email address and we'll send you instructions to reset your password.
                    </p>
                </div>

                <!-- Status alert container -->
                <div id="statusAlert" style="display: none; margin: 0 1.5rem 1rem;"></div>

                <form id="forgotForm" class="auth-form" novalidate>

                    <div class="auth-form-section">
                        <!-- Email Field -->
                        <div class="auth-field-group">
                            <label class="auth-label" for="resetEmail">
                                Email Address <span class="auth-required" title="Required">*</span>
                            </label>
                            <div class="auth-input-wrap">
                                <i class="fas fa-envelope auth-input-icon" aria-hidden="true"></i>
                                <input type="email" id="resetEmail" class="auth-input"
                                    placeholder="your.email@example.com" maxlength="100"
                                    autocomplete="email" required aria-describedby="emailError">
                            </div>
                            <span class="auth-field-error" id="emailError" aria-live="polite"></span>
                        </div>
                    </div>

                    <!-- Submit & Actions -->
                    <div class="auth-submit-section">
                        <button type="submit" id="submitBtn" class="auth-submit-btn">
                            <i class="fas fa-paper-plane" aria-hidden="true"></i>
                            <span>Send Reset Link</span>
                        </button>

                        <p class="auth-switch-link" style="margin-top: 1.25rem;">
                            Remember your password?
                            <a href="login.html" class="auth-link">Back to Login</a>
                        </p>
                    </div>

                </form>

            </div>

        </div>
    </main>

    <!-- ============================================================
         SCRIPTS
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jnoigbvvxwpvxefunvfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impub2lnYnZ2eHdwdnhlZnVudmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkzMjEsImV4cCI6MjEwNTMyNTMyMX0.kg07-fyqAPdnSqs4RxNvzvbD5VhNR8vtFkg-RS5pMnA';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('resetEmail');
        const emailErr = document.getElementById('emailError');
        const submitBtn = document.getElementById('submitBtn');
        const statusAlert = document.getElementById('statusAlert');

        emailInput.addEventListener('input', () => {
            emailErr.textContent = '';
            emailErr.style.display = 'none';
            emailInput.classList.remove('input-error');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            if (!email) {
                emailErr.textContent = 'Please enter your email address.';
                emailErr.style.display = 'block';
                emailInput.classList.add('input-error');
                emailInput.focus();
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailErr.textContent = 'Please enter a valid email address.';
                emailErr.style.display = 'block';
                emailInput.classList.add('input-error');
                emailInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>Sending…</span>';
            statusAlert.style.display = 'none';

            try {
                // Determine redirect URL to users/reset-password.html
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                const redirectUrl = window.location.origin + basePath + 'reset-password.html';

                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl
                });

                if (error) {
                    console.warn('[EDMITH Auth] Reset error:', error);
                }

                // Security requirement 46: Always show generic message
                // "If an account exists with this email address, password reset instructions have been sent."
                statusAlert.className = 'auth-card-banner-msg success';
                statusAlert.innerHTML = '<i class="fas fa-circle-check"></i> If an account exists with this email address, password reset instructions have been sent.';
                statusAlert.style.display = 'flex';

                emailInput.value = '';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Send Reset Link</span>';

            } catch (err) {
                console.error('[EDMITH Auth] Error:', err);
                statusAlert.className = 'auth-card-banner-msg success';
                statusAlert.innerHTML = '<i class="fas fa-circle-check"></i> If an account exists with this email address, password reset instructions have been sent.';
                statusAlert.style.display = 'flex';

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Send Reset Link</span>';
            }
        });
    </script>
    <script src="../javascript/script.js"></script>

</body>
</html>
